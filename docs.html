<!DOCTYPE html>
<html>

<head>
  <title>Open Cloud Mesh API Reference Documentation</title>
  <!-- needed for adaptive design -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,700|Roboto:300,400,700" rel="stylesheet">

  <!--
    ReDoc doesn't change outer page styles
    -->
  <style>
    body {
      margin: 0;
      padding: 0;
    }
  </style>
</head>

<body>
  <redoc></redoc>
  <script>
    const params = new URLSearchParams(window.location.search);

    const defaults = {
      user: 'cs3org',
      repo: 'OCM-API',
      branch: 'develop'
    };

    let mutated = false;
    for (const key in defaults) {
      if (!params.has(key)) {
        params.set(key, defaults[key]);
        mutated = true;
      }
    }

    if (mutated) {
      params.sort();
      window.location.replace('?' + params.toString());
    }

    const user = params.get('user');
    const repo = params.get('repo');
    const branch = params.get('branch');

    const specUrl =
      `https://raw.githubusercontent.com/${user}/${repo}/${branch}/spec.yaml`;

    const redocScriptUrl =
      `https://${user}.github.io/${repo}/scripts/redoc.standalone-v3.0.0-rc.0.js`;

    const redocEl = document.querySelector('redoc');
    redocEl.setAttribute('spec-url', specUrl);

    const script = document.createElement('script');
    script.src = redocScriptUrl;
    script.async = true;
    script.defer = true;
    document.body.appendChild(script);
  </script>
</body>

</html>
