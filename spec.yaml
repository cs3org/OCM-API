openapi: 3.0.3
info:
  title: Open Cloud Mesh API
  description: >
    Open Cloud Mesh OpenAPI Specification.
    The semantic of the Protocol Specification is detailed in the OCM Internet-Draft document
    published at the [IETF Datatracker](https://datatracker.ietf.org/doc/draft-ietf-ocm-open-cloud-mesh).
  version: 1.4.0
  x-logo:
    url: logo.png
servers:
  - url: https://{ocm_endpoint}
    description: >
      The root of the Open Cloud Mesh API, dynamically resolved by taking the `endpoint`
      value returned by the Discovery endpoint. 
    variables:
      ocm_endpoint:
        default: cloud.example.org/ocm
paths:
  /.well-known/ocm:
    servers:
      - url: https://cloud.example.org
        description: The OCM Server's top-level FQDN.
    get:
      summary: Discovery endpoint
      description: >
        Following [RFC8615], this endpoint returns the properties and
        capabilities offered by an OCM Server. See [OCM API Discovery](https://datatracker.ietf.org/doc/html/draft-ietf-ocm-open-cloud-mesh#ocm-api-discovery)
        for more details.
      responses:
        "200":
          description: The API endpoint, version, public key, and capabilities of this OCM
            Server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discovery"
  /request-share:
    post:
      summary: Request access to a share
      description: >
        This endpoint is used to request access to a share.
        The request MUST contain the share ID and the OCM address of the party
        who wants to receive the share.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestShare"
        description: The JSON object to request access to a share.
        required: true
      responses:
        "201":
          description: >
            Consumer successfully received request.
        "400":
          description: >
            Bad request due to invalid or missing parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/400"
        "404":
          description: >
            The requested `share` is missing, or the requestor does not have
            rights to access it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: The server doesn't support requesting shares.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The server is temporary unavailable (e.g. due to planned
            maintenance).
          headers:
            Retry-After:
              description: >
                Indication for the client when the service could be requested
                again in HTTP Date format as used by the Internet Message
                Format [RFC5322] (e.g. `Wed, 21 Oct 2015 07:28:00 GMT`) or the
                number of seconds (e.g. 3000 if you the service is expected to
                be available again within 50 minutes).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /shares:
    post:
      summary: Share Creation Notification endpoint
      description: >
        This endpoint is used by a Sending Server to notify a Receiving Server that
        a new Share has been created. See [Share Creation Notification](https://datatracker.ietf.org/doc/html/draft-ietf-ocm-open-cloud-mesh#share-creation-notification)
        for more details.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewShare"
        description: The JSON object to create a new share at the consumer side.
        required: true
      responses:
        "201":
          description: >
            Consumer successfully received the share. The response might contain
            the display name of the recipient of the share for general user
            experience improvement.
          content:
            application/json:
              schema:
                type: object
                properties:
                  recipientDisplayName:
                    type: string
                    description: >
                      Display name of the recipient
                    example: John Doe
                  recipientPublicKeys:
                    type: array
                    items:
                      type: string
                    description: >
                      The public key(s) of the recipient. This value MUST be provided
                      in case the Share Creation Notification includes the `ssh` protocol.
        "400":
          description: >
            Bad request due to invalid parameters, e.g. when `shareWith` is not
            found or required properties are missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/400"
        "401":
          description: Sender cannot be authenticated as a trusted service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Sender is not authorized to create shares.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: The Receiver doesn't support incoming external shares, the share
            type or the resource type is not supported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The Receiver is temporary unavailable (e.g. due to planned
            maintenance).
          headers:
            Retry-After:
              description: >
                Indication for the client when the service could be requested
                again in HTTP Date format as used by the Internet Message
                Format [RFC5322] (e.g. `Wed, 21 Oct 2015 07:28:00 GMT`) or the
                number of seconds (e.g. 3000 if you the service is expected to
                be available again within 50 minutes).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /notifications:
    post:
      summary: Share Acceptance Notification endpoint
      description: >
        This optional endpoint is used to inform the other party about a change
        that concerns a previously known entity, such as a Share or a trusted User.
        See [Share Acceptance Notification](https://datatracker.ietf.org/doc/html/draft-ietf-ocm-open-cloud-mesh#share-acceptance-notification)
        for more details.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewNotification"
        description: The JSON object with a new notification
        required: true
      responses:
        "201":
          description: >
            Receiver succesfully received the notification. The response body
            MAY contain
            a JSON object with some resonse data, depending on the actual notification.
        "400":
          description: |
            Bad request due to invalid parameters, e.g. when `type` is invalid
            or missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/400"
        "401":
          description: Client cannot be authenticated as a trusted service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Trusted service is not authorized to create notifications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: |
            The receiver doesn't support notifications, the resource type is not
            supported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: |
            The receiver is temporary unavailable (e.g. due to planned
            maintenance).
          headers:
            Retry-After:
              description: |
                Indication for the client when the service could be requested
                again in HTTP Date format as used by the Internet Message Format
                [RFC5322] (e.g. `Wed, 21 Oct 2015 07:28:00 GMT`) or the number
                of seconds (e.g. 3000 if you the service is expected to be
                available again within 50 minutes).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /invite-accepted:
    post:
      summary: Invitation Acceptance endpoint
      description: >
        This optional endpoint is used to inform the Sender that an Invitation was accepted.
        See [Invite flow](https://datatracker.ietf.org/doc/html/draft-ietf-ocm-open-cloud-mesh#invite-flow)
        for more details.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptedInvite"
        description: The JSON object to notify the OCM provider that an invite has been
          accepted.
        required: true
      responses:
        "200":
          description: Invitation Acceptance Request successful (see [Invite Acceptance
            Response](https://datatracker.ietf.org/doc/html/draft-ietf-ocm-open-cloud-mesh#invite-acceptance-response-details))
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedInviteResponse"
        "400":
          description: The Invitation Token is invalid or does not exist (see [Invite
            Acceptance
            Response](https://datatracker.ietf.org/doc/html/draft-ietf-ocm-open-cloud-mesh#invite-acceptance-response-details))
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Invite Receiver OCM Server is not trusted to accept this Invite
            (see [Invite Acceptance
            Response](https://datatracker.ietf.org/doc/html/draft-ietf-ocm-open-cloud-mesh#invite-acceptance-response-details))
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Invitation already accepted (see [Invite Acceptance
            Response](https://datatracker.ietf.org/doc/html/draft-ietf-ocm-open-cloud-mesh#invite-acceptance-response-details))
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    id:
      name: id
      in: path
      description: Unique ID to identify the share at the consumer side.
      required: true
      schema:
        type: string
    page:
      name: page
      in: query
      required: false
      description: >
        Default parameter to handle paging through collections. However, this
        parameter is NOT mandatory, as clients should use the HAL navigation
        links (e.g. `_links.next.href`) to paginate. These links enable the
        possibility to use vendor specific pagination.
      schema:
        type: integer
        default: 1
  schemas:
    "400":
      type: object
      allOf:
        - $ref: "#/components/schemas/Error"
        - properties:
            validationErrors:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                    example: shareWith
                  message:
                    type: string
                    description: >
                      A validation error message which is understandable for
                      both humans and machines (e.g. no use of special
                      characters) providing more information on the cause of the
                      validation error.
                    example: NOT_FOUND
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: >
            An error message which is understandable for both humans and
            machines (e.g. no use of special characters) providing more
            information on the cause of the error.
          example: RESOURCE_NOT_FOUND
    Discovery:
      type: object
      required:
        - enabled
        - apiVersion
        - endPoint
        - resourceTypes
      properties:
        enabled:
          type: boolean
          description: Whether the OCM service is enabled at this endpoint
        apiVersion:
          type: string
          description: The OCM API version this endpoint supports
          example: 1.4.0
        endPoint:
          type: string
          description: The URI of the OCM API available at this endpoint
          example: https://cloud.example.org/ocm
        provider:
          type: string
          description: A friendly branding name of this endpoint
          example: MyCloudStorage
        resourceTypes:
          type: array
          description: |
            A list of all supported resource types with their access protocols.
            Each resource type is identified by its `name`: the list MUST NOT
            contain more than one resource type object per given `name`.
          items:
            type: object
            properties:
              name:
                type: string
                description: >
                  A supported resource type (file, calendar, contact, ...).
                  Implementations MUST offer support for at least one resource type,
                  where `file` is the commonly supported one.
                  Each resource type is identified by its `name`: the list MUST NOT
                  contain more than one resource type object per given `name`.
                  Other values are to be registered in the "OCM Resource Types"
                  registry (see the IANA Considerations section of the OCM
                  Internet-Draft).
                example: file
              shareTypes:
                type: array
                description: |
                  The supported recipient share types.
                  MUST contain `"user"` at a minimum, plus optionally
                  `"group"` and `"federation"`.
                items:
                  type: string
                  enum:
                    - user
                    - group
                    - federation
                example:
                  - user
              protocols:
                type: object
                description: >
                  The supported protocols to access shared resources at this endpoint.
                  Implementations MUST support at least `webdav` for `file` resources,
                  any other combination of resources and protocols is optional.
                properties:
                  webdav:
                    type: string
                    description: >
                      The top-level WebDAV path at this endpoint. In order to access
                      a remote shared resource, implementations SHOULD use this path
                      as a prefix (see sharing examples).
                  webdav-receive:
                    type: object
                    required:
                      - uri
                    description: >
                      Implementations that support receiving WebDAV shares SHOULD
                      advertise them here. Note though that older implementations MAY
                      not support this property.
                    properties:
                      uri:
                        type: string
                        description: >
                          This property signals that this endpoint is capable of
                          receiving `webdav` shares with the given URI format.
                          The value MUST be either `"absolute"` or `"relative"`.
                        enum:
                          - absolute
                          - relative
                  webapp:
                    type: object
                    description: >
                      Implementations that support sending WebApp shares MUST advertise
                      them here, with an empty object as value.
                  webapp-receive:
                    type: object
                    required:
                      - targets
                    description: >
                      Implementations that support receiving WebApp shares MUST
                      advertise them here.
                    properties:
                      targets:
                        type: array
                        minItems: 1
                        description: >
                          The ways this endpoint is able to present a webapp
                          share to the user when acting as receiver.
                          - "blank" signals that this endpoint supports opening
                            the URI in a top-level browsing context, such as a
                            new window or tab, or a full page navigation in the
                            current window.
                          - "iframe" signals that this endpoint supports
                            embedding the URI in an iframe within its own UI,
                            when the Sending Server allows framing by this
                            receiver.
                        items:
                          type: string
                          enum:
                            - blank
                            - iframe
                  ssh:
                    type: string
                    description: >
                      The top-level address in the form `host:port` of an endpoint
                      that supports ssh and scp with a public/private key based
                      authentication.
                  ssh-receive:
                    type: object
                    description: >
                      Implementations that support receiving SSH shares MUST
                      advertise them here, with an empty object as value.
                additionalProperties:
                    oneOf:
                      - type: string
                      - type: object
                    description: >
                      Any additional protocol supported for this resource type SHOULD
                      be advertised here, where the value MAY correspond to a top-level
                      URI to be used for that protocol, or any other relevant
                      attribute required for that protocol. Similarly, additional
                      receiving capabilities for custom protocols SHOULD be advertised.
                      Additional protocols are to be registered in the "OCM Protocols"
                      registry (see the IANA Considerations section of the OCM
                      Internet-Draft).
                example:
                  webdav: /remote/dav/ocm/
                  webdav-receive: {
                    "uri": "absolute"
                  }
                  webapp: {}
                  webapp-receive: {
                    "targets": ["blank", "iframe"]
                  }
                  talk: /apps/spreed/api/
        capabilities:
          type: array
          description: >
            The optional capabilities exposed at this endpoint according to the
            present specifications.
          items:
            type: string
            enum:
              - enforce-mfa
              - exchange-token
              - http-sig
              - invites
              - invite-wayf
              - notifications
              - protocol-object
          example:
            - protocol-object
            - invites
            - http-sig
        criteria:
          type: array
          description: |
            The criteria for accepting a Share Creation Notification.
            As all Receiving Servers should require the use of TLS in API calls,
            it is not necessary to expose that as a criterium.
          items:
            type: string
            enum:
              - must-use-http-sig
              - must-exchange-token
              - denylist
              - allowlist
              - must-invite
          example:
            - allowlist
            - must-invite
        jwksUri:
          type: string
          format: uri
          description: >
            Optional URL of a JWK Set document [RFC7517] containing the
            public keys this OCM Server uses for HTTP Message Signatures
            [RFC9421]. The URL is discovered from this field; it is not a
            fixed path in the OCM API. If the `http-sig` capability is
            exposed, the jwksUri MUST be advertised in the discovery
            response.
          example: https://cloud.example.org/ocm/jwks
        tokenEndPoint:
          type: string
          format: uri
          description: >
            Optional URL of the Token Exchange endpoint hosted by the
            Sending Server. The URL is discovered from this field; it is not
            a fixed path in the OCM API. The Receiving Server POSTs here to
            obtain a short-lived bearer token in exchange for an authorization
            code (the share's `sharedSecret`), following the authorization_code
            grant of [RFC6749]. If the `exchange-token` capability is exposed,
            the tokenEndPoint MUST be advertised in the discovery response.
            The request MUST be signed with an HTTP Message Signature
            [RFC9421] by the Receiving Server. See TokenRequest and
            TokenResponse for the request/response contract and the Code Flow
            section of the OCM Internet-Draft for normative procedure.

            **HTTP Responses:**
            - 200: Token issued (application/json with TokenResponse schema)
            - 400: Token denied (application/json OAuth error object with
              `{ "error": "<code>" }` where code is one of invalid_request,
              invalid_client, invalid_grant, unauthorized_client, or
              unsupported_grant_type)
          example: https://cloud.example.org/ocm/token
        inviteAcceptDialog:
          type: string
          description: >
            Optional URL path of a web page where a user can accept an invite, when query parameters `"token"` and `"providerDomain"` are provided.
            Implementations that offer the `invites` capability SHOULD provide this URL as well in order to enhance the UX of the Invite Flow.
            If for example `"/index.php/apps/sciencemesh/accept"` is specified here then a Where-Are-You-From page could redirect the end-user
            to `/index.php/apps/sciencemesh/accept?token=zi5kooKu3ivohr9a&providerDomain=example.com`.
          example: /index.php/apps/sciencemesh/accept
    NewShare:
      type: object
      required:
        - shareWith
        - name
        - providerId
        - owner
        - sender
        - shareType
        - resourceType
        - protocol
      properties:
        shareWith:
          type: string
          description: >
            OCM Address of the user, group or federation the
            provider wants to share the resource with. This MUST be known
            in advance, either via a previous Invitation or through other means.
          example: 51dc30ddc473d43a6011e9ebba6ca770@geant.org
        name:
          type: string
          description: Name of the resource (file or folder).
          example: resource.txt
        description:
          type: string
          description: Optional description of the resource (file or folder).
          example: |
            This is the Open API Specification file (in YAML format) of the Open
            Cloud Mesh API.
        providerId:
          type: string
          description: >
            Opaque value to identify the Shared Resource at the provider side.
            This MUST be unique per Resource and per share, such that multiple
            shares of a given Resource are guaranteed to get different values.
          example: 7c084226-d9a1-11e6-bf26-cec0c932ce01
        owner:
          description: |
            OCM Address of the user who owns the resource.
          type: string
          example: 6358b71804dfa8ab069cf05ed1b0ed2a@apiwise.nl
        sender:
          description: |
            OCM Address of the user that wants to share the
            resource.
          type: string
          example: 527bd5b5d689e2c32ae974c6229ff785@apiwise.nl
        ownerDisplayName:
          type: string
          description: |
            Display name of the owner of the resource
          example: Dimitri
        senderDisplayName:
          type: string
          description: |
            Display name of the user that wants to share the resource
          example: John Doe
        shareType:
          type: string
          enum:
            - user
            - group
            - federation
          description: |
            Recipient share type
          example: user
        resourceType:
          type: string
          description: |
            Resource type (file, folder, calendar, contact, ...)
          example: file
        expiration:
          type: integer
          description: >
            The expiration time for the share, in seconds of UTC time since Unix
            epoch. If omitted, it is assumed that the share does not expire. A sender
            server MAY use the `expiration` to signal that the resource represents
            a cached copy of a dataset that was made available for an efficient
            data transfer to the destination server.
        protocol:
          type: object
          description: |
            JSON object with specific options for each protocol.
            The supported protocols are:
            - `webdav`, to access the data via WebDAV
            - `webapp`, to access remote web applications
            - `ssh`, to access the data via SFTP/SCP
            Other custom protocols might be added in the future.
          required:
            - name
          properties:
            name:
              type: string
              description: >
                The name of the protocol. Default: `multi`.
                If `multi` is given, one or more protocol endpoints are expected
                to be defined according to the optional properties specified below.
                Otherwise, at least `webdav` is expected to be supported, and
                its options MAY be given in the opaque `options` payload for
                compatibility with v1.0 implementations (see examples). Note
                though that this format is deprecated.
                Warning: client implementers should be aware that v1.1 servers
                MAY support both `webdav` and `multi`, but v1.0 servers MAY
                only support `webdav`.
                This field may be removed in a future major version of the spec.
            options:
              type: object
              description: >
                This property is now deprecated. Implementations are
                encouraged to
                transition to the new optional properties defined below, such that
                this field may be removed in a future major version of the spec.
            webdav:
              type: object
              required:
                - uri
                - sharedSecret
                - permissions
              properties:
                accessTypes:
                  type: array
                  description: >
                    The type of access being granted to the remote resource.
                    If omitted, it defaults to `['remote']`.
                    - `remote` signals the recipient that the resource is available
                      for remote access and interactive browsing.
                    - `datatx` signals the recipient to transfer the resource
                      from the given URI. The recipient MAY delegate a third-party
                      service to execute the data transfer on their behalf.
                  items:
                    type: string
                    enum:
                      - remote
                      - datatx
                uri:
                  type: string
                  description: >
                    An URI to access the remote resource. The URI MAY be relative,
                    such as a key or a UUID, in which case the prefix exposed by the
                    `/.well-known/ocm` endpoint MUST be used to access the resource, or
                    it MAY be absolute, including a hostname.
                    In all cases, for a `folder` resource, the composed URI acts
                    as the root path, such that other files located within it MUST
                    be accessible by appending their relative path to that URI.
                sharedSecret:
                  type: string
                  description: >
                    A secret to be used to access the resource, such as a bearer token.
                    To prevent leaking it in logs it MUST NOT appear in any URI.
                permissions:
                  type: array
                  description: >
                    The permissions granted to the sharee.
                    - `read` allows read-only access including download of a copy.
                    - `write` allows create, update, and delete rights on the resource.
                    - `share` allows re-share rights on the resource.
                  items:
                    type: string
                    enum:
                      - read
                      - write
                      - share
                requirements:
                  type: array
                  items:
                    type: string
                    description: >
                      A list of requirements that the recipient provider MUST fulfill
                      to access the resource. Requirements are optional, but if it is
                      present it MUST NOT be empty. A recipient provider MUST reject
                      a share whose requirements it does not understand.
                      The following requirements are currently supported:
                      - `must-use-mfa` requires the user accessing the resource to be
                        MFA-authenticated. This requirement MAY be used if the
                        recipient provider exposes the `enforce-mfa` capability.
                      - `must-exchange-token` requires the recipient to exchange the given
                        `sharedSecret` via a signed HTTPS request to tokenEndPoint at the
                        Sending Server, in order to get a short-lived token to be used
                        for subsequent access [RFC6749]. This requirement MAY be used if
                        the Sending Server exposes the `exchange-token` capability and
                        `tokenEndPoint`, and MUST be included when the Receiving Server
                        advertises `must-exchange-token` in criteria.
                    enum:
                      - must-use-mfa
                      - must-exchange-token
                size:
                  type: integer
                  description: >
                    The size of the resource to be transferred, useful especially
                    in case of `datatx` access type.
            webapp:
              type: object
              required:
                - uri
                - sharedSecret
                - targets
                - permissions
                - requirements
              properties:
                uri:
                  type: string
                  description: >
                    An URI to a client-browsable view of the remote resource, such that
                    users may use a web application available at the sender site.
                    The URI MUST be absolute, including a hostname. In case the
                    underlying resource is a folder, the URI MUST act as a root path,
                    such that files located within the folder are made accessible in
                    the web app by appending their relative path to the URI.
                targets:
                  type: array
                  minItems: 1
                  description: >
                    How the recipient should present the URI to the user.
                    This array is REQUIRED and MUST NOT be empty: a webapp
                    share without a target is invalid.
                    - "blank" signals the recipient to open the URI in a top-level
                    browsing context chosen by the receiver, such as a new window or
                    tab, or a full page navigation in the current window.
                    - "iframe" signals the recipient to embed the URI in an iframe within
                      its own UI, when the Sending Server allows framing by the recipient.
                  items:
                    type: string
                    enum:
                      - blank
                      - iframe
                permissions:
                  type: array
                  minItems: 1
                  description: >
                    The permissions granted to the sharee. This array is
                    REQUIRED and MUST NOT be empty.
                    - `view` allows access to the web app in view-only mode.
                    - `read` allows read and download access via the web app.
                    - `write` allows full editing rights via the web app.
                    - `share` allows re-share rights on the resource. This only
                      applies to web apps that provide a mechanism for re-sharing.
                  items:
                    type: string
                    enum:
                      - view
                      - read
                      - write
                      - share
                requirements:
                  type: array
                  minItems: 1
                  description: >
                    The requirements that the sharee MUST fulfill to access the
                    resource. This array is REQUIRED and MUST at least include
                    `must-exchange-token`. If multiple protocols are present in
                    the share payload, the requirements for the different
                    protocols MUST agree.
                    - `must-use-mfa` requires the user accessing the resource to be
                      MFA-authenticated. This requirement MAY be used if the
                      recipient provider exposes the `enforce-mfa` capability.
                    - `must-exchange-token` requires the recipient to exchange the given
                      `sharedSecret` via a signed HTTPS request to tokenEndPoint at the
                      Sending Server, in order to get a short-lived token to be used
                      for subsequent access [RFC6749].
                  items:
                    type: string
                    enum:
                      - must-use-mfa
                      - must-exchange-token
                sharedSecret:
                  type: string
                  description: >
                    A secret for accessing the remote web app. To give access to the
                    remote app, the receiver MUST first exchange this value at the
                    Sending Server's `tokenEndPoint` using the Code Flow, then perform
                    an HTTP POST request to the given URI with the resulting bearer
                    token in a form field named `access_token`, along with another form
                    field named `expired_session_redirect_uri` that represents the
                    absolute HTTPS URI where the receiving server can restart access
                    to the web app when the browser session expires. Web apps that
                    do not support session refresh MAY ignore this field.
                    The shared secret MUST
                    NOT be exposed to the browser and MUST NOT appear in any URI. In a
                    multi-protocol share, requirements that affect shared access policy
                    MUST agree across the offered protocols.
                appIconHint:
                  type: string
                  description: >
                    An optional string in the form of a media type (MIME type) that
                    describes the share as a whole, primarily intended as a way for
                    the receiving server to select an appropriate local icon for the
                    share. This is display metadata and MUST NOT be interpreted as
                    fetchable or executable content. It does not need to appear in
                    `mediaTypes`, but SHOULD describe the primary shared resource.
                appName:
                  type: string
                  description: >
                    An optional human-friendly name of the web application to be used
                    in user interfaces when referring to this share.
                mediaTypes:
                  type: array
                  description: >
                    An optional array that describes the media (MIME) types that the
                    webapp server can handle. This is a hint for receiver UI and
                    routing decisions, and receivers MAY ignore values they do not
                    understand. Unlike `appIconHint`, this describes formats the
                    webapp can open rather than the share-level icon hint.
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: string
            ssh:
              type: object
              properties:
                accessTypes:
                  type: array
                  description: >
                    The type of access being granted to the remote resource.
                    If omitted, it defaults to `['remote']`.
                    - `remote` signals the recipient that the resource is available
                      for remote access, e.g. via sshfs.
                    - `datatx` signals the recipient to transfer the resource from
                      the given URI via scp. The recipient MAY delegate a third-party
                      service to execute the data transfer on their behalf.
                  items:
                    type: string
                    enum:
                      - remote
                      - datatx
                uri:
                  type: string
                  description: >
                    The full address to be used for ssh or scp access, in the form
                    `username@host.fqdn:port/resource/path`, where authentication is
                    expected to take place via public/private key.
          additionalProperties:
            type: object
            description: >
              Any optional additional protocols supported for this resource
              MAY be provided here, along with their custom payload. Appropriate
              capabilities SHOULD be advertised in order for a sender to ensure
              the recipient can parse such customized payloads.
          example:
            singleProtocolLegacy:
              name: webdav
              options:
                sharedSecret: hfiuhworzwnur98d3wjiwhr
                permissions: some permissions scheme
            singleProtocolNew:
              name: multi
              webdav:
                uri: 7c084226-d9a1-11e6-bf26-cec0c932ce01
                sharedSecret: hfiuhworzwnur98d3wjiwhr
                permissions:
                  - read
                  - write
            multipleProtocols:
              name: multi
              webdav:
                accessTypes: ["remote", "datatx"]
                uri: https://cloud.example.org/remote/dav/ocm/7c084226-d9a1-11e6-bf26-cec0c932ce01
                sharedSecret: hfiuhworzwnur98d3wjiwhr
                permissions:
                  - read
                requirements:
                  - must-use-mfa
                  - must-exchange-token
              webapp:
                uri: https://apps.example.org/hedgedoc/7c084226-d9a1-11e6-bf26-cec0c932ce01
                sharedSecret: hfiuhworzwnur98d3wjiwhr
                targets:
                  - blank
                permissions:
                  - read
                requirements:
                  - must-use-mfa
                  - must-exchange-token
                appName: HedgeDoc
                appIconHint: text/markdown
                mediaTypes:
                  - text/markdown
                  - text/html
              ssh:
                accessTypes: ["datatx"]
                uri: extuser@cloud.example.org:/7c084226-d9a1-11e6-bf26-cec0c932ce01
    NewNotification:
      type: object
      required:
        - notificationType
        - resourceType
        - providerId
      properties:
        notificationType:
          type: string
          description: |
            A notification type that is understandable for both humans and
            machines (e.g. no use of special characters) providing more
            information on the cause of the error.
            Values that MAY be used by implementations are:
            `SHARE_ACCEPTED`, `SHARE_DECLINED`, `REQUEST_RESHARE`,
            `SHARE_UNSHARED`, `RESHARE_UNDO`, `RESHARE_CHANGE_PERMISSION`,
            `USER_REMOVED`.
        resourceType:
          type: string
          description: |
            Resource type (file, folder, user, calendar, contact, ...)
        providerId:
          type: string
          description: |
            Identifier of the shared resource. If the resourceType is `file`,
            then see `NewShare/providerId` for the required information.
            If the resourceType is `user`, then this is the user identifier
            previously sent via `/invite-accepted`.
        notification:
          type: object
          description: |
            Optional additional parameters, depending on the notification
            and the resource type.
      example:
        shareWasAccepted:
          notificationType: SHARE_ACCEPTED
          resourceType: file
          providerId: 7c084226-d9a1-11e6-bf26-cec0c932ce01
          notification:
            message: Recipient accepted the share
            sharedSecret: hfiuhworzwnur98d3wjiwhr
        userWasRemoved:
          notificationType: USER_REMOVED
          resourceType: user
          providerId: 51dc30ddc473d43a6011e9ebba6ca770
    AcceptedInvite:
      type: object
      required:
        - recipientProvider
        - token
        - userID
        - email
        - name
      properties:
        recipientProvider:
          type: string
          format: fqdn
          description: FQDN of the receiver OCM service.
          example: receiver.org
        token:
          type: string
          description: Token received in the invite
          example: xyz
        userID:
          type: string
          description: Unique ID to identify the Invite Receiver at their OCM Server.
          example: 51dc30ddc473d43a6011e9ebba6ca770
        email:
          type: string
          description: Email address of the Invite Receiver.
          example: richard@gmail.com
        name:
          type: string
          description: Name of the Invite Receiver.
          example: Richard Feynman
    AcceptedInviteResponse:
      type: object
      required:
        - userID
        - email
        - name
      properties:
        userID:
          type: string
          description: Unique ID to identify the Invite Sender at their OCM Server.
          example: 9302
        email:
          type: string
          description: Email ID of the Invite Sender.
          example: john@sender.org
        name:
          type: string
          description: Name of the Invite Sender.
          example: John Doe
    RequestShare:
      type: object
      required:
        - owner
        - shareWith
        - share
      properties:
        owner:
          type: string
          description: >
            OCM Address of the user who will be requested to share
            the resource.
          example: 527bd5b5d689e2c32ae974c6229ff785@apiwise.nl
        shareWith:
          type: string
          description: >
            OCM Address of the user, group or federation that
            wants to receive a share of the resource.
          example: 51dc30ddc473d43a6011e9ebba6ca770@geant.org
        share:
          type: string
          description: A unique identifier for the resource.
          example: 1234567890abcdef or https://ocm.example.org/files/spec.yaml
    TokenRequest:
      type: object
      required:
        - grant_type
        - client_id
        - code
      properties:
        client_id:
          type: string
          format: fqdn
          description: FQDN of the Receiving Server.
          example: receiver.org
        code:
          type: string
          description: Secret received in the Share Creation Notification
          example: xyz
        grant_type:
          type: string
          description: Must be set to 'authorization_code'
          enum: ["authorization_code"]
          example: authorization_code
        redirect_uri:
          type: string
          description: >
            Optional parameter that MUST be ignored by the server.
          example: https://receiver.org/ocm/callback
    TokenResponse:
      type: object
      required:
        - access_token
        - token_type
      properties:
        access_token:
          type: string
          description: The bearer token to be used to access the protocol-specific API(s)
          example: asdfgh
        token_type:
          type: string
          description: Must be set to 'Bearer'
          enum:
            - Bearer
          example: Bearer
        expires_in:
          type: integer
          description: Number of seconds before this access_token will need to be refreshed.
          example: 300
