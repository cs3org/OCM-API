openapi: 3.0.3
info:
  title: Open Cloud Mesh API
  description: >
    Open Cloud Mesh OpenAPI Specification.
    The semantic of the Protocol Specification is detailed in the OCM Internet-Draft document
    published at the [IETF Datatracker](https://datatracker.ietf.org/doc/draft-ietf-ocm-open-cloud-mesh).
  version: 1.5.0
  x-logo:
    url: logo.png
servers:
  - url: https://{ocm_endpoint}
    description: >
      The root of the Open Cloud Mesh API, dynamically resolved by taking the `endpoint`
      value returned by the Discovery endpoint. 
    variables:
      ocm_endpoint:
        default: cloud.example.org/ocm
paths:
  /.well-known/ocm:
    servers:
      - url: https://cloud.example.org
        description: The origin used for OCM API discovery.
    get:
      summary: Discovery endpoint
      description: >
        Following [RFC8615], this endpoint returns the properties and
        capabilities offered by an OCM Server. See [OCM API Discovery](https://datatracker.ietf.org/doc/html/draft-ietf-ocm-open-cloud-mesh#ocm-api-discovery)
        for more details.
      responses:
        "200":
          description: The API endpoint, version, public key, and capabilities of this OCM
            Server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discovery"
  /mls/key-packages:
    get:
      summary: Retrieve an MLS KeyPackage for a user
      description: >
        Returns MLS KeyPackages for a user as defined by
        [KeyPackage Distribution](https://datatracker.ietf.org/doc/html/draft-ietf-ocm-mls-federated-groups#keypackage-distribution).
        This path is relative to the OCM endpoint returned by discovery; for
        example, an endpoint of `https://cloud.example.org/ocm` resolves this
        path to `https://cloud.example.org/ocm/mls/key-packages`.
        The request and successful response MUST use HTTP Message Signatures
        according to that specification.
      parameters:
        - name: userId
          in: query
          required: true
          description: Full OCM Address of the user whose KeyPackage is requested.
          schema:
            $ref: "#/components/schemas/OCMAddress"
          example: alice@cloud.example.org
        - name: senderDomain
          in: query
          required: true
          description: OCM Server Address of the requesting server.
          schema:
            $ref: "#/components/schemas/OCMServerAddress"
          example: requester.example.org
      responses:
        "200":
          description: A signed response containing KeyPackages for the user.
          headers:
            Content-Digest:
              required: true
              description: RFC 9530 digest of the response body.
              schema:
                type: string
            Signature-Input:
              required: true
              description: RFC 9421 response signature input.
              schema:
                type: string
            Signature:
              required: true
              description: RFC 9421 response signature.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyPackageResponse"
        "400":
          description: Missing or invalid query parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/400"
        "401":
          description: The request signature is missing, invalid, or replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The verified sender is not permitted by local policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: The requester has exceeded the KeyPackage request limit.
          headers:
            Retry-After:
              description: Time to wait before making another request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /mls/ratchet-tree:
    get:
      summary: Retrieve the ratchet tree of an MLS group epoch
      description: >
        Returns the ratchet tree of one epoch of a federated group, as defined by
        [Group State Retrieval](https://datatracker.ietf.org/doc/html/draft-ietf-ocm-mls-federated-groups#group-state).
        Served by Admin Servers to the Member Server that received a Welcome for
        that epoch, and to any other server named in a leaf credential of that
        epoch's tree. This path is relative to the OCM endpoint returned by
        discovery. The request and successful response MUST use HTTP Message
        Signatures according to that specification.
      parameters:
        - name: mlsGroupId
          in: query
          required: true
          description: Base64url-encoded MLS group_id without padding.
          schema:
            type: string
          example: UmVzZWFyY2hHcm91cA
        - name: epoch
          in: query
          required: true
          description: Epoch whose ratchet tree is requested.
          schema:
            type: integer
            format: int64
            minimum: 0
          example: 42
        - name: senderDomain
          in: query
          required: true
          description: OCM Server Address of the requesting server.
          schema:
            $ref: "#/components/schemas/OCMServerAddress"
          example: requester.example.org
      responses:
        "200":
          description: A signed response containing the ratchet tree.
          headers:
            Content-Digest:
              required: true
              description: RFC 9530 digest of the response body.
              schema:
                type: string
            Signature-Input:
              required: true
              description: RFC 9421 response signature input.
              schema:
                type: string
            Signature:
              required: true
              description: RFC 9421 response signature.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatchetTreeResponse"
        "400":
          description: Missing or invalid query parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/400"
        "401":
          description: The request signature is missing, invalid, or replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            The epoch is not retained, or the verified sender is not named in a
            leaf credential of that epoch's tree. The two cases are deliberately
            indistinguishable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: The requester has exceeded the request limit.
          headers:
            Retry-After:
              description: Time to wait before making another request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /mls/commits:
    get:
      summary: Retrieve missed Commits of an MLS group
      description: >
        Returns the Commits of a federated group sent in the given epoch and
        later, in epoch order, as defined by
        [Group State Retrieval](https://datatracker.ietf.org/doc/html/draft-ietf-ocm-mls-federated-groups#group-state).
        Served by Admin Servers to servers named in a leaf credential of the
        tree of epoch `from`. The sequence ends at the latest Commit the server
        holds or at the Commit removing the requester's last leaf; the server
        MAY stop after any entry, and the requester repeats the request from
        the epoch following the last entry. An empty `commits` array means the
        requester is current. This path is relative to the OCM endpoint
        returned by discovery. The request and successful response MUST use
        HTTP Message Signatures according to that specification.
      parameters:
        - name: mlsGroupId
          in: query
          required: true
          description: Base64url-encoded MLS group_id without padding.
          schema:
            type: string
          example: UmVzZWFyY2hHcm91cA
        - name: from
          in: query
          required: true
          description: >
            Epoch in which the first requested Commit was sent, that is, the
            requester's current epoch.
          schema:
            type: integer
            format: int64
            minimum: 0
          example: 42
        - name: senderDomain
          in: query
          required: true
          description: OCM Server Address of the requesting server.
          schema:
            $ref: "#/components/schemas/OCMServerAddress"
          example: requester.example.org
      responses:
        "200":
          description: A signed response containing the Commits.
          headers:
            Content-Digest:
              required: true
              description: RFC 9530 digest of the response body.
              schema:
                type: string
            Signature-Input:
              required: true
              description: RFC 9421 response signature input.
              schema:
                type: string
            Signature:
              required: true
              description: RFC 9421 response signature.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitsResponse"
        "400":
          description: Missing or invalid query parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/400"
        "401":
          description: The request signature is missing, invalid, or replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            Epoch `from` is not retained, or the verified sender is not named in
            a leaf credential of that epoch's tree. The two cases are
            deliberately indistinguishable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: The requester has exceeded the request limit.
          headers:
            Retry-After:
              description: Time to wait before making another request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /shares:
    post:
      summary: Share Creation Notification endpoint
      description: >
        This endpoint is used by a Sending Server to notify a Receiving Server that
        a new Share has been created. See [Share Creation Notification](https://datatracker.ietf.org/doc/html/draft-ietf-ocm-open-cloud-mesh#share-creation-notification)
        for more details.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewShare"
        description: The JSON object to create a new share at the consumer side.
        required: true
      responses:
        "201":
          description: >
            Consumer successfully received the share. The response might contain
            the display name of the recipient of the share for general user
            experience improvement.
          content:
            application/json:
              schema:
                type: object
                properties:
                  recipientDisplayName:
                    type: string
                    description: >
                      Display name of the recipient
                    example: John Doe
                  recipientPublicKeys:
                    type: array
                    items:
                      type: string
                    description: >
                      The public key(s) of the recipient. This value MUST be provided
                      in case the Share Creation Notification includes the `ssh` protocol.
        "400":
          description: >
            Bad request due to invalid parameters, e.g. when `shareWith` is not
            found or required properties are missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/400"
        "401":
          description: Sender cannot be authenticated as a trusted service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Sender is not authorized to create shares.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: The Receiver doesn't support incoming external shares, the share
            type or the resource type is not supported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The Receiver is temporary unavailable (e.g. due to planned
            maintenance).
          headers:
            Retry-After:
              description: >
                Indication for the client when the service could be requested
                again in HTTP Date format as used by the Internet Message
                Format [RFC5322] (e.g. `Wed, 21 Oct 2015 07:28:00 GMT`) or the
                number of seconds (e.g. 3000 if you the service is expected to
                be available again within 50 minutes).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /notifications:
    post:
      summary: General Notification endpoint
      description: >
        Notifications and requests concerning Resources, Collections, Recipients
        or Federation membership.
        See [Notifications](https://datatracker.ietf.org/doc/html/draft-ietf-ocm-open-cloud-mesh#notifications)
        for details.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewNotification"
            examples:
              requestShare:
                summary: A recipient requests shares from a collection
                value:
                  notificationType: REQUEST_SHARE
                  resourceType: collection
                  shareType: user
                  senderDomain: alice.example.org
                  collectionId: research-data-123
                  notification:
                    collection:
                      owner: bob@bob.example.org
                      shareWith: alice@alice.example.org
                      permissions:
                      - read
              contactWasRemoved:
                summary: A user removed a single contact
                value:
                  notificationType: CONTACT_REMOVED
                  shareType: user
                  senderDomain: alice.example.org
                  notification:
                    message: User is not a trusted contact any longer
                    user:
                      userId: alice@alice.example.org
                      targetUserId: bob@bob.example.org
              shareWasAccepted:
                summary: A recipient accepted a share
                value:
                  notificationType: SHARE_ACCEPTED
                  resourceType: file
                  shareType: user
                  senderDomain: sender.example.org
                  notification:
                    message: Recipient accepted the share
                    file:
                      providerId: 7c084226-d9a1-11e6-bf26-cec0c932ce01
              shareWasUnshared:
                summary: A provider removed a share
                value:
                  notificationType: SHARE_UNSHARED
                  resourceType: file
                  senderDomain: sender.example.org
                  notification:
                    file:
                      providerId: 7c084226-d9a1-11e6-bf26-cec0c932ce01
              userLeft:
                summary: A user left the sending server
                value:
                  notificationType: USER_REMOVED
                  shareType: user
                  senderDomain: alice.example.org
                  notification:
                    message: User left the system
                    user:
                      userId: alice@alice.example.org
              mlsWelcome:
                summary: MLS Welcome envelope (illustrative content)
                value:
                  notificationType: MLS_WELCOME
                  shareType: community
                  senderDomain: cloud.example.org
                  notification:
                    community:
                      mlsGroupId: 51dc30ddc473d43a6011e9ebba6ca770
                      userId: bob@cloud.example.org
                      content: base64 MLS welcome
              customType:
                summary: An implementer-defined notification type
                value:
                  notificationType: EXAMPLE_CUSTOM_EVENT
                  resourceType: file
                  senderDomain: sender.example.org
                  notification:
                    message: Something happened
              ocmServerWasAdded:
                summary: An OCM server was added to a federation
                value:
                  notificationType: OCM_SERVER_ADDED
                  resourceType: federation
                  senderDomain: ocm-server.example.org
                  notification:
                    message: Your OCM Server is now part of our federation
                    federation:
                      federationId: sciencemesh
                      name: The ScienceMesh Directory
                      url: https://cloud.example.org
              ocmServerLeft:
                summary: An OCM server left a federation
                value:
                  notificationType: OCM_SERVER_REMOVED
                  resourceType: federation
                  senderDomain: ocm-server.example.org
                  notification:
                    message: We are leaving this federation
                    federation:
                      federationId: sciencemesh
                      name: The ScienceMesh Directory
                      url: https://ocm-server.example.org
        description: The JSON object with a new notification
        required: true
      responses:
        "201":
          description: >
            Notification accepted. The response has no body. Receipt does
            not guarantee a state change or distributed completion.
        "400":
          description: >
            Invalid notification envelope or malformed payload for a known
            notification type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/400"
        "401":
          description: Requestor cannot be authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Requestor is not authorized to send notifications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            The notification refers to a missing target (share, user, etc.), or the requestor
            does not have rights to access it.
        "501":
          description: >
            Notifications or the requested operation are not implemented
            by the receiver.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >
            The receiver is temporary unavailable (e.g. due to planned
            maintenance).
          headers:
            Retry-After:
              description: >
                Indication for the client when the service could be requested
                again in HTTP Date format as used by the Internet Message Format
                [RFC5322] (e.g. `Wed, 21 Oct 2015 07:28:00 GMT`) or the number
                of seconds (e.g. 3000 if you the service is expected to be
                available again within 50 minutes).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /invite-accepted:
    post:
      summary: Invitation Acceptance endpoint
      description: >
        This optional endpoint is used to inform the Sender that an Invitation was accepted.
        See [Invite flow](https://datatracker.ietf.org/doc/html/draft-ietf-ocm-open-cloud-mesh#invite-flow)
        for more details.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptedInvite"
        description: The JSON object to notify the OCM provider that an invite has been
          accepted.
        required: true
      responses:
        "200":
          description: Invitation Acceptance Request successful (see [Invite Acceptance
            Response](https://datatracker.ietf.org/doc/html/draft-ietf-ocm-open-cloud-mesh#invite-acceptance-response-details))
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedInviteResponse"
        "400":
          description: The Invitation Token is invalid or does not exist (see [Invite
            Acceptance
            Response](https://datatracker.ietf.org/doc/html/draft-ietf-ocm-open-cloud-mesh#invite-acceptance-response-details))
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Invite Receiver OCM Server is not trusted to accept this Invite
            (see [Invite Acceptance
            Response](https://datatracker.ietf.org/doc/html/draft-ietf-ocm-open-cloud-mesh#invite-acceptance-response-details))
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Invitation already accepted (see [Invite Acceptance
            Response](https://datatracker.ietf.org/doc/html/draft-ietf-ocm-open-cloud-mesh#invite-acceptance-response-details))
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    id:
      name: id
      in: path
      description: Unique ID to identify the share at the consumer side.
      required: true
      schema:
        type: string
    page:
      name: page
      in: query
      required: false
      description: >
        Default parameter to handle paging through collections. However, this
        parameter is NOT mandatory, as clients should use the HAL navigation
        links (e.g. `_links.next.href`) to paginate. These links enable the
        possibility to use vendor specific pagination.
      schema:
        type: integer
        default: 1
  schemas:
    "400":
      type: object
      allOf:
        - $ref: "#/components/schemas/Error"
        - properties:
            validationErrors:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                    example: shareWith
                  message:
                    type: string
                    description: >
                      A validation error message which is understandable for
                      both humans and machines (e.g. no use of special
                      characters) providing more information on the cause of the
                      validation error.
                    example: NOT_FOUND
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: >
            An error message which is understandable for both humans and
            machines (e.g. no use of special characters) providing more
            information on the cause of the error.
          example: RESOURCE_NOT_FOUND
    IPProtocolFields:
      description: >
        Credential-free protocol fields; required entries depend on context.
      allOf:
        - $ref: "#/components/schemas/ShareProtocolFields"
        - type: object
          # name is scalar metadata; every other member is a protocol entry.
          properties:
            name: {}
          additionalProperties:
            type: object
            not:
              required: [sharedSecret]
    IPShareProtocol:
      description: >
        Full IP protocol payload, using the core fields without credentials.
      allOf:
        - $ref: "#/components/schemas/IPProtocolFields"
        - required: [name]
          properties:
            webdav:
              required: [uri]
            webapp:
              required: [uri, targets, permissions, requirements]
            ssh:
              required: [uri]
    IPShareProvisioningRequest:
      type: object
      description: >
        Share fields sent to {integrationAPI}/shares on a paired Protocol
        Server before the core Share Creation Notification. Top-level name is
        optional; protocol entries are credential-free. Unknown fields are open.
      required:
        - sender
        - owner
        - shareWith
        - providerId
        - shareType
        - resourceType
        - protocol
      allOf:
        - $ref: "#/components/schemas/ShareFields"
      properties:
        protocol:
          $ref: "#/components/schemas/IPShareProtocol"
      example:
        shareWith: bob@receiver.example.org
        name: analysis.ipynb
        providerId: 7c084226-d9a1-11e6-bf26-cec0c932ce01
        owner: alice@cloud.example.org
        sender: alice@cloud.example.org
        shareType: user
        resourceType: file
        protocol:
          name: multi
          webdav:
            uri: 7c084226-d9a1-11e6-bf26-cec0c932ce01
            permissions:
            - read
            - write
            requirements:
            - must-exchange-token
          webapp:
            uri: https://hub.example.org/services/ocm/open
            targets:
            - blank
            permissions:
            - write
            requirements:
            - must-exchange-token
    IPShareProvisioningResponse:
      type: object
      description: >
        Optional status and partial allocated protocol fields. Returned
        permissions cannot override the Share's granted authority. The OCM
        Server MUST ignore any sharedSecret in an ordinary allocation reply.
      properties:
        status:
          type: string
        protocol:
          $ref: "#/components/schemas/IPProtocolFields"
      example:
        status: stored
    IPTokenPreparationResponse:
      type: object
      description: >
        Delegated Token Server preparation reply. Unlike ordinary provisioning,
        this partial protocol payload may carry the minted sharedSecret.
        The example credential is illustrative.
      properties:
        status:
          type: string
        protocol:
          $ref: "#/components/schemas/ShareProtocolFields"
      example:
        protocol:
          webdav:
            sharedSecret: illustrative-minted-secret
    IPShareRevocationRequest:
      type: object
      description: Share Revocation Request sent to {integrationAPI}/revoke.
      required: [sender, providerId]
      properties:
        sender:
          $ref: "#/components/schemas/OCMAddress"
        providerId:
          $ref: "#/components/schemas/ShareFields/properties/providerId"
      example:
        sender: alice@cloud.example.org
        providerId: 7c084226-d9a1-11e6-bf26-cec0c932ce01
    IPShareRevocationResponse:
      type: object
      description: Optional status after an idempotent revocation.
      properties:
        status:
          type: string
      example:
        status: revoked
    IPIntrospectionRequest:
      type: object
      description: >
        Form fields for application/x-www-form-urlencoded at the introspection
        endpoint exchanged during pairing. The token is the credential exactly
        as presented on the front channel.
      required: [token]
      properties:
        token:
          type: string
      example:
        token: shr-9wq4xkz7vmd2
    OCMIPClaim:
      type: object
      description: >
        Share information for self-contained access. Parties are bound by the
        enclosing iss, sub and aud claims; they are not required here.
      required: [protocol, providerId, resourceType]
      properties:
        protocol:
          $ref: "#/components/schemas/IPShareProtocol"
        providerId:
          $ref: "#/components/schemas/ShareFields/properties/providerId"
        resourceType:
          $ref: "#/components/schemas/ShareFields/properties/resourceType"
        name:
          $ref: "#/components/schemas/ShareFields/properties/name"
        shareType:
          $ref: "#/components/schemas/ShareFields/properties/shareType"
        expiration:
          $ref: "#/components/schemas/ShareFields/properties/expiration"
    IPAccessTokenHeader:
      type: object
      description: >
        Decoded JOSE header for an IP access token. The algorithm MUST be
        asymmetric and match the signatory key advertised by the OCM Server.
        Excluding none structurally does not verify algorithm suitability,
        signature validity, key provenance or trust.
      required: [typ, kid, alg]
      properties:
        typ:
          type: string
          enum: [at+jwt]
        kid:
          type: string
        alg:
          type: string
          not:
            enum: [none]
      example:
        typ: at+jwt
        alg: EdDSA
        kid: cloud.example.org#key1
    IPCommonClaims:
      type: object
      properties:
        iss:
          type: string
          format: uri
          description: >
            HTTPS issuer URL identifying the Sending Server. Its authority is
            the OCM Server Address. URI format is only a structural annotation.
        sub:
          type: string
          description: Opaque local identifier of the Share owner at the issuer.
        aud:
          $ref: "#/components/schemas/OCMAddress"
        exp:
          type: integer
          description: NumericDate bounding token or introspection validity.
        client_id:
          type: string
          description: >
            Provider-assigned identifier. In provisioned mode it equals the
            Share's providerId, unlike the core TokenRequest client_id.
        ocm_ip:
          $ref: "#/components/schemas/OCMIPClaim"
    IPTokenClaims:
      description: >
        Decoded RFC 9068 claims in both IP issuance modes. The audience is the
        receiving principal. HTTPS, pairing, issuer/key and identity binding,
        expiry and live authority require verification beyond these schemas.
      allOf:
        - $ref: "#/components/schemas/IPCommonClaims"
        - type: object
          required: [iss, sub, aud, iat, exp, jti, client_id]
          properties:
            iat:
              type: integer
              description: Token issuance NumericDate.
            jti:
              type: string
              description: Token identifier as in RFC 9068.
    IPProvisionedTokenClaims:
      description: >
        Provisioned token claims. client_id identifies the stored Share Record;
        ocm_ip is forbidden so the token cannot mix integration modes.
      allOf:
        - $ref: "#/components/schemas/IPTokenClaims"
        - not:
            required: [ocm_ip]
      example:
        iss: https://cloud.example.org
        sub: alice
        aud: bob@receiver.example.org
        client_id: 7c084226-d9a1-11e6-bf26-cec0c932ce01
        iat: 1781186460
        exp: 1781190060
        jti: f3b9c0aa-2f6e-4d57-9d24-6f0a1f6d9b11
    IPSelfContainedTokenClaims:
      description: >
        Self-contained token claims. exp MUST NOT exceed the Share expiration
        when present.
      allOf:
        - $ref: "#/components/schemas/IPTokenClaims"
        - required: [ocm_ip]
      example:
        iss: https://cloud.example.org
        sub: alice
        aud: bob@receiver.example.org
        client_id: receiver.example.org
        iat: 1781186460
        exp: 1781186760
        jti: 0d9e3c4b-5a6f-4e21-8c37-2b1a9f8e7d65
        ocm_ip:
          providerId: 9b2e41d7-aa31-4a02-9f0d-3c5e8b7a6f10
          resourceType: folder
          name: dataset-2026
          protocol:
            name: multi
            webdav:
              uri: 9b2e41d7-aa31-4a02-9f0d-3c5e8b7a6f10
              permissions:
              - read
    IPIntrospectionResponse:
      description: >
        Inactive, active provisioned or active self-contained introspection.
        An active response requires exactly one of client_id and ocm_ip.
        Active extensions remain open. Verify authentication, pairing and exp
        before relying on the response.
      oneOf:
        - $ref: "#/components/schemas/IPInactiveIntrospectionResponse"
        - $ref: "#/components/schemas/IPActiveProvisionedIntrospectionResponse"
        - $ref: "#/components/schemas/IPActiveSelfContainedIntrospectionResponse"
    IPInactiveIntrospectionResponse:
      type: object
      required: [active]
      properties:
        active:
          type: boolean
          enum: [false]
      additionalProperties: false
      example:
        active: false
    IPActiveIntrospectionResponse:
      allOf:
        - $ref: "#/components/schemas/IPCommonClaims"
        - type: object
          required: [active, iss, sub, aud, exp]
          properties:
            active:
              type: boolean
              enum: [true]
    IPActiveProvisionedIntrospectionResponse:
      description: Illustrative active response naming a provisioned Share.
      allOf:
        - $ref: "#/components/schemas/IPActiveIntrospectionResponse"
        - required: [client_id]
          not:
            required: [ocm_ip]
      example:
        active: true
        iss: https://cloud.example.org
        sub: alice
        aud: bob@receiver.example.org
        exp: 1781190060
        client_id: 7c084226-d9a1-11e6-bf26-cec0c932ce01
    IPActiveSelfContainedIntrospectionResponse:
      allOf:
        - $ref: "#/components/schemas/IPActiveIntrospectionResponse"
        - required: [ocm_ip]
          not:
            required: [client_id]
      example:
        active: true
        iss: https://cloud.example.org
        sub: alice
        aud: carol@legacy.example.com
        exp: 1781186760
        ocm_ip:
          providerId: 4f6a2c81-77b0-4c0e-9e64-1d2f3a5b6c7d
          resourceType: folder
          name: dataset-2026
          protocol:
            name: multi
            webdav:
              uri: 4f6a2c81-77b0-4c0e-9e64-1d2f3a5b6c7d
              permissions:
              - read
    # MLS
    KeyPackageEntry:
      type: object
      required:
        - mediaType
        - encoding
        - content
      properties:
        mediaType:
          type: string
          enum:
            - message/mls
          example: message/mls
        encoding:
          type: string
          enum:
            - base64url
          example: base64url
        content:
          type: string
          description: Base64url-encoded MLS KeyPackage without padding.
          example: ZXhhbXBsZS1tbHMta2V5LXBhY2thZ2U
    KeyPackageResponse:
      type: object
      required:
        - userId
        - keyPackages
      properties:
        userId:
          allOf:
            - $ref: "#/components/schemas/OCMAddress"
          description: Full OCM Address of the user represented by the KeyPackages.
          example: alice@cloud.example.org
        keyPackages:
          type: array
          items:
            $ref: "#/components/schemas/KeyPackageEntry"
    RatchetTreeResponse:
      type: object
      required:
        - mlsGroupId
        - epoch
        - ratchetTree
      properties:
        mlsGroupId:
          type: string
          description: Base64url-encoded MLS group_id without padding.
          example: UmVzZWFyY2hHcm91cA
        epoch:
          type: integer
          format: int64
          minimum: 0
          description: Epoch whose ratchet tree is returned.
          example: 42
        ratchetTree:
          type: object
          required:
            - encoding
            - content
          properties:
            encoding:
              type: string
              enum:
                - base64url
              example: base64url
            content:
              type: string
              description: >
                Base64url-encoded TLS serialisation of the ratchet_tree value
                defined in RFC 9420 Section 12.4.3.3, without padding.
              example: ZXhhbXBsZS1yYXRjaGV0LXRyZWU
    CommitEntry:
      type: object
      required:
        - epoch
        - content
      properties:
        epoch:
          type: integer
          format: int64
          minimum: 0
          description: Epoch in which the Commit was sent.
          example: 42
        proposals:
          type: array
          description: >
            Base64url-encoded MLS PublicMessages carrying the proposals the
            Commit covers by reference, in the order of the references in the
            Commit. Present whenever the Commit covers at least one proposal
            by reference.
          items:
            type: string
            example: ZXhhbXBsZS1tbHMtcHJvcG9zYWw
        content:
          type: string
          description: Base64url-encoded MLS PublicMessage carrying the Commit.
          example: ZXhhbXBsZS1tbHMtY29tbWl0
    CommitsResponse:
      type: object
      required:
        - mlsGroupId
        - commits
      properties:
        mlsGroupId:
          type: string
          description: Base64url-encoded MLS group_id without padding.
          example: UmVzZWFyY2hHcm91cA
        commits:
          type: array
          description: Commits in increasing epoch order, without gaps.
          items:
            $ref: "#/components/schemas/CommitEntry"
    Discovery:
      type: object
      required:
        - enabled
        - apiVersion
        - endPoint
        - resourceTypes
      properties:
        enabled:
          type: boolean
          description: Whether the OCM service is enabled at this endpoint
        apiVersion:
          type: string
          description: The OCM API version this endpoint supports
          example: 1.5.0
        endPoint:
          type: string
          description: The URI of the OCM API available at this endpoint
          example: https://cloud.example.org/ocm
        provider:
          type: string
          description: A friendly branding name of this endpoint
          example: MyCloudStorage
        resourceTypes:
          type: array
          description: |
            A list of all supported resource types with their access protocols.
            Each resource type is identified by its `name`: the list MUST NOT
            contain more than one resource type object per given `name`.
          items:
            type: object
            properties:
              name:
                type: string
                description: >
                  A supported resource type (file, calendar, contact, ...).
                  Implementations MUST offer support for at least one resource type,
                  where `file` is the commonly supported one.
                  Each resource type is identified by its `name`: the list MUST NOT
                  contain more than one resource type object per given `name`.
                  Other values are to be registered in the "OCM Resource Types"
                  registry (see the IANA Considerations section of the OCM
                  Internet-Draft).
                example: file
              shareTypes:
                type: array
                description: |
                  The supported recipient share types.
                  MUST contain `"user"` at a minimum, plus optionally
                  `"group"` and `"community"`.
                items:
                  type: string
                  enum:
                    - user
                    - group
                    - community
                example:
                  - user
              protocols:
                type: object
                description: >
                  The supported protocols to access shared resources at this endpoint.
                  Implementations MUST support at least `webdav` for `file` resources,
                  any other combination of resources and protocols is optional.
                properties:
                  webdav:
                    type: string
                    description: >
                      The top-level WebDAV path at this endpoint. In order to access
                      a remote shared resource, implementations SHOULD use this path
                      as a prefix (see sharing examples).
                  webdav-receive:
                    type: object
                    required:
                      - uri
                    description: >
                      Implementations that support receiving WebDAV shares SHOULD
                      advertise them here. Note though that older implementations MAY
                      not support this property.
                    properties:
                      uri:
                        type: string
                        description: >
                          This property signals that this endpoint is capable of
                          receiving `webdav` shares with the given URI format.
                          The value MUST be either `"absolute"` or `"relative"`.
                        enum:
                          - absolute
                          - relative
                  webapp:
                    type: object
                    description: >
                      Implementations that support sending WebApp shares MUST advertise
                      them here, with an empty object as value.
                  webapp-receive:
                    type: object
                    required:
                      - targets
                    description: >
                      Implementations that support receiving WebApp shares MUST
                      advertise them here.
                    properties:
                      targets:
                        type: array
                        minItems: 1
                        description: >
                          The ways this endpoint is able to present a webapp
                          share to the user when acting as receiver.
                          - "blank" signals that this endpoint supports opening
                            the URI in a top-level browsing context, such as a
                            new window or tab, or a full page navigation in the
                            current window.
                          - "iframe" signals that this endpoint supports
                            embedding the URI in an iframe within its own UI,
                            when the Sending Server allows framing by this
                            receiver.
                        items:
                          type: string
                          enum:
                            - blank
                            - iframe
                  ssh:
                    type: string
                    description: >
                      The top-level address in the form `host:port` of an endpoint
                      that supports ssh and scp with a public/private key based
                      authentication.
                  ssh-receive:
                    type: object
                    description: >
                      Implementations that support receiving SSH shares MUST
                      advertise them here, with an empty object as value.
                additionalProperties:
                  oneOf:
                    - type: string
                    - type: object
                  description: >
                    Any additional protocol supported for this resource type SHOULD
                    be advertised here, where the value MAY correspond to a top-level
                    URI to be used for that protocol, or any other relevant
                    attribute required for that protocol. Similarly, additional
                    receiving capabilities for custom protocols SHOULD be advertised.
                    Additional protocols are to be registered in the "OCM Protocols"
                    registry (see the IANA Considerations section of the OCM
                    Internet-Draft).
                example:
                  webdav: /remote/dav/ocm/
                  webdav-receive: {
                    "uri": "absolute"
                  }
                  webapp: {}
                  webapp-receive: {
                    "targets": ["blank", "iframe"]
                  }
                  talk: /apps/spreed/api/
        capabilities:
          type: array
          description: >
            The optional capabilities exposed at this endpoint according to the
            present specifications.
          items:
            type: string
            enum:
              - enforce-mfa
              - exchange-token
              - http-sig
              - invites
              - invite-wayf
              - notifications
              - protocol-object
          example:
            - protocol-object
            - invites
            - http-sig
        criteria:
          type: array
          description: |
            The criteria for accepting a Share Creation Notification.
            As all Receiving Servers should require the use of TLS in API calls,
            it is not necessary to expose that as a criterium.
          items:
            type: string
            enum:
              - must-use-http-sig
              - must-exchange-token
              - denylist
              - allowlist
              - must-invite
          example:
            - allowlist
            - must-invite
        jwksUri:
          type: string
          format: uri
          description: >
            Optional URL of a JWK Set document [RFC7517] containing the
            public keys this OCM Server uses for HTTP Message Signatures
            [RFC9421]. The URL is discovered from this field; it is not a
            fixed path in the OCM API. If the `http-sig` capability is
            exposed, the jwksUri MUST be advertised in the discovery
            response and MUST use https, though implementations MAY fall
            back to HTTP in testing setups.
          example: https://cloud.example.org/ocm/jwks
        tokenEndPoint:
          type: string
          format: uri
          description: >
            Optional URL of the Token Exchange endpoint hosted by the
            Sending Server. The URL is discovered from this field; it is not
            a fixed path in the OCM API. The Receiving Server POSTs here to
            obtain a short-lived bearer token in exchange for an authorization
            code (the share's `sharedSecret`), following the authorization_code
            grant of [RFC6749]. If the `exchange-token` capability is exposed,
            the tokenEndPoint MUST be advertised in the discovery response.
            The request MUST be signed with an HTTP Message Signature
            [RFC9421] by the Receiving Server. See TokenRequest and
            TokenResponse for the request/response contract and the Code Flow
            section of the OCM Internet-Draft for normative procedure.

            **HTTP Responses:**
            - 200: Token issued (application/json with TokenResponse schema)
            - 400: Token denied (application/json OAuth error object with
              `{ "error": "<code>" }` where code is one of invalid_request,
              invalid_client, invalid_grant, unauthorized_client, or
              unsupported_grant_type)
          example: https://cloud.example.org/ocm/token
        directoryEndPoint:
          type: string
          format: uri
          description: >
            Optional URL of the Directory Endpoint hosted by this OCM Server,
            where it exposes the Federations it is a member of, along with
            their membership. The URL MUST use https, though implementations
            MAY fall back to HTTP in testing setups.
            The presence of this field is the only signal that an OCM Server
            offers a Directory Service; no dedicated capability is defined.
            See the Directory schema for the payload, and the Directory
            Service section of the OCM Internet-Draft for the normative
            procedure, including the peer-announced propagation of the
            membership by means of the `OCM_SERVER_ADDED` and
            `OCM_SERVER_REMOVED` notifications.

            **HTTP Responses:**
            - 200: `application/json` with a Directory object, whose
              `federation` property carries either a single Federation object,
              when this OCM Server is a member of exactly one Federation, or
              an array of Federation objects, one per Federation. Consumers
              MUST accept both forms.
            - 404: This OCM Server does not expose any Federation.
          example: https://cloud.example.org/ocm/directory
        inviteAcceptDialog:
          type: string
          description: >
            Optional URL path of a web page where a user can accept an invite, when query parameters `"token"` and `"providerDomain"` are provided.
            Implementations that offer the `invites` capability SHOULD provide this URL as well in order to enhance the UX of the Invite Flow.
            If for example `"/index.php/apps/sciencemesh/accept"` is specified here then a Where-Are-You-From page could redirect the end-user
            to `/index.php/apps/sciencemesh/accept?token=zi5kooKu3ivohr9a&providerDomain=example.com`.
          example: /index.php/apps/sciencemesh/accept
    Directory:
      type: object
      description: >
        The Federations an OCM Server is a member of, as exposed at the
        `directoryEndPoint` advertised in the Discovery response, or by a
        third-party Directory Service. The `federation` property carries a
        single Federation object, when the OCM Server is a member of exactly
        one Federation, or an array of Federation objects, one per
        Federation: consumers MUST accept both forms.

        The document is not signed: in the peer-announced model the trust
        rests with the OCM Server administrators, who approve every member of
        their own federation configuration, whereas in the MLS-based model the
        authoritative membership is the MLS group state, which is
        cryptographically verifiable. It MUST be fetched over TLS, and a
        consumer MUST NOT treat it as an authorisation to interact with the
        OCM Servers it lists.
      required:
        - federation
      properties:
        federation:
          oneOf:
            - $ref: "#/components/schemas/Federation"
            - type: array
              items:
                $ref: "#/components/schemas/Federation"
      example:
        federation:
          federationId: sciencemesh
          name: The ScienceMesh Directory
          servers:
            - url: https://ocm-server.example.org
              displayName: My OCM Server
            - url: https://ocm-server.example.com:4443
              displayName: Another OCM Server
            - url: http://192.168.1.1:8080
              displayName: Test OCM Server
    Federation:
      type: object
      description: >
        One Federation of OCM Servers and its membership.
      required:
        - federationId
        - name
        - servers
      properties:
        federationId:
          type: string
          pattern: "^[a-z0-9-]+$"
          description: >
            A short, stable identifier of the Federation, agreed out of band
            among its members. Members of the same Federation MUST use the
            same value, as it is used to correlate the documents published by
            the different members, and to identify the Federation in an
            `OCM_SERVER_ADDED` or `OCM_SERVER_REMOVED` notification.
          example: sciencemesh
        name:
          type: string
          description: A human-readable name of the Federation.
          example: The ScienceMesh Directory
        mlsGroupId:
          type: string
          description: >
            Optional identifier of the MLS group that manages this Federation,
            when the cryptographically guaranteed model specified in the
            OCM-MLS Internet-Draft is in use. In that case the authoritative
            membership is the MLS group state at the current epoch, and this
            document is informative.
          example: 51dc30ddc473d43a6011e9ebba6ca770
        servers:
          type: array
          description: >
            The OCM Servers that are members of this Federation. The
            publishing OCM Server SHOULD include itself.
          items:
            type: object
            required:
              - url
              - displayName
            properties:
              url:
                type: string
                format: uri
                description: >
                  An absolute URL identifying the OCM Server. It MUST include
                  a scheme, either `https://` or (for testing purposes)
                  `http://`, and a host, either a FQDN or an IP address. It
                  MAY include a non-default port. It MUST NOT include a base
                  path (e.g. `/ocm`), nor userinfo, query or fragment.
                example: https://ocm-server.example.org
              displayName:
                type: string
                description: A human-readable name for the OCM Server.
                example: My OCM Server
    ShareFields:
      type: object
      properties:
        shareWith:
          allOf:
            - $ref: "#/components/schemas/OCMAddress"
          description: >
            OCM Address of the user, group or community the
            provider wants to share the resource with. This MUST be known
            in advance, either via a previous Invitation or through other means.
          example: 51dc30ddc473d43a6011e9ebba6ca770@geant.org
        name:
          type: string
          description: Name of the resource (file or folder).
          example: resource.txt
        description:
          type: string
          description: Optional description of the resource (file or folder).
          example: |
            This is the Open API Specification file (in YAML format) of the Open
            Cloud Mesh API.
        providerId:
          type: string
          description: >
            Opaque value to identify the Shared Resource at the provider side.
            This MUST be unique per Resource and per share, such that multiple
            shares of a given Resource are guaranteed to get different values.
          example: 7c084226-d9a1-11e6-bf26-cec0c932ce01
        collectionId:
          type: string
          description: >
            Opaque identifier of a Collection containing this Resource. A Collection
            groups one or more Resources whose membership and semantics are defined
            by the Sending Server; they MAY have different locations and resource
            types. Multiple Resources and Shares MAY carry the same value; global
            uniqueness is not required. The identifier MAY be advertised out of band,
            for example in a catalog, and used in a REQUEST_SHARE notification.
            Each Share fulfilling that request MUST carry the requested collectionId
            unchanged. Unsolicited Shares MAY also include it. The Receiving Server
            MAY use it to associate incoming Shares with a pending request for the
            Collection to the Sending Server. It does not replace providerId or
            grant access to any Resource.
          example: research-data-123
        collectionSize:
          type: integer
          minimum: 1
          description: >
            Total number of distinct Shares representing the Collection for this
            recipient, including this Share. When collectionId is present and the total
            is known, collectionSize SHOULD be included. When present, it MUST be at
            least 1 and MUST be accompanied by collectionId. If the total is unknown,
            collectionSize MUST be omitted. A Share offering multiple protocols counts
            as one Share. When included in Shares fulfilling the same request, the
            values MUST agree.
            The Receiving Server MAY compare this value with the number of distinct
            providerId values received for the Collection and recipient from the
            Sending Server to determine whether receipt of the Collection is complete.
          example: 3
        owner:
          description: |
            OCM Address of the user who owns the resource.
          allOf:
            - $ref: "#/components/schemas/OCMAddress"
          example: 6358b71804dfa8ab069cf05ed1b0ed2a@apiwise.nl
        sender:
          description: |
            OCM Address of the user that wants to share the
            resource.
          allOf:
            - $ref: "#/components/schemas/OCMAddress"
          example: 527bd5b5d689e2c32ae974c6229ff785@apiwise.nl
        ownerDisplayName:
          type: string
          description: |
            Display name of the owner of the resource
          example: Dimitri
        senderDisplayName:
          type: string
          description: |
            Display name of the user that wants to share the resource
          example: John Doe
        shareType:
          type: string
          enum:
            - user
            - group
            - community
          description: |
            Recipient share type
          example: user
        resourceType:
          type: string
          description: |
            Resource type (file, folder, calendar, contact, ...)
          example: file
        expiration:
          type: integer
          description: >
            The expiration time for the share, in seconds of UTC time since Unix
            epoch. If omitted, it is assumed that the share does not expire. A sender
            server MAY use the `expiration` to signal that the resource represents
            a cached copy of a dataset that was made available for an efficient
            data transfer to the destination server.
    ShareProtocolFields:
      type: object
      properties:
        name:
          type: string
          description: >
            The name of the protocol. Default: `multi`.
            If `multi` is given, one or more protocol endpoints are expected
            to be defined according to the optional properties specified below.
            Otherwise, at least `webdav` is expected to be supported, and
            its options MAY be given in the opaque `options` payload for
            compatibility with v1.0 implementations (see examples). Note
            though that this format is deprecated.
            Warning: client implementers should be aware that v1.1+ servers
            MAY support both `webdav` and `multi`, but v1.0 servers MAY
            only support `webdav`.
            This field may be removed in a future version of the spec.
        options:
          type: object
          description: >
            This property is now deprecated. Implementations are encouraged to
            transition to the new optional properties defined below, such that
            this field may be removed in a future version of the spec.
        webdav:
          type: object
          properties:
            accessTypes:
              type: array
              description: >
                The type of access being granted to the remote resource.
                If omitted, it defaults to `['remote']`.
                - `remote` signals the recipient that the resource is available
                  for remote access and interactive browsing.
                - `datatx` signals the recipient to transfer the resource
                  from the given URI. The recipient MAY delegate a third-party
                  service to execute the data transfer on their behalf.
              items:
                type: string
                enum:
                  - remote
                  - datatx
            uri:
              type: string
              description: >
                An URI to access the remote resource. The URI MAY be relative,
                such as a key or a UUID, in which case the prefix exposed by the
                `/.well-known/ocm` endpoint MUST be used to access the resource, or
                it MAY be absolute, including a hostname.
                In all cases, for a `folder` resource, the composed URI acts
                as the root path, such that other files located within it MUST
                be accessible by appending their relative path to that URI.
            sharedSecret:
              type: string
              description: >
                A secret to be used to access the resource, such as a bearer token.
                To prevent leaking it in logs it MUST NOT appear in any URI.
            permissions:
              type: array
              description: >
                The permissions granted to the sharee.
                - `read` allows read-only access including download of a copy.
                - `create` allows creating new resources within the shared
                  resource, e.g. in an upload-only folder.
                - `update` allows updating existing resources.
                - `delete` allows deleting resources.
                - `write` allows create, update, and delete rights on the
                  resource. It is kept for backwards compatibility and
                  SHALL be interpreted as the union of `create`, `update`,
                  and `delete` in any given permissions set. A recipient
                  that only supports `write` SHOULD grant it when any of
                  `create`, `update`, or `delete` is present.
                - `share` allows re-share rights on the resource.
              items:
                type: string
                enum:
                  - read
                  - create
                  - update
                  - delete
                  - write
                  - share
            requirements:
              type: array
              items:
                type: string
                description: >
                  A list of requirements that the recipient provider MUST fulfill
                  to access the resource. Requirements are optional.
                  A recipient provider MUST reject
                  a share whose requirements it does not understand.
                  The following requirements are currently supported:
                  - `must-use-mfa` requires the user accessing the resource to be
                    MFA-authenticated. This requirement MAY be used if the
                    recipient provider exposes the `enforce-mfa` capability.
                  - `must-exchange-token` requires the recipient to exchange the given
                    `sharedSecret` via a signed HTTPS request to tokenEndPoint at the
                    Sending Server, in order to get a short-lived token to be used
                    for subsequent access [RFC6749]. This requirement MAY be used if
                    the Sending Server exposes the `exchange-token` capability and
                    `tokenEndPoint`, and MUST be included when the Receiving Server
                    advertises `must-exchange-token` in criteria.
                enum:
                  - must-use-mfa
                  - must-exchange-token
            size:
              type: integer
              description: >
                The size of the resource to be transferred, useful especially
                in case of `datatx` access type.
        webapp:
          type: object
          properties:
            uri:
              type: string
              description: >
                An URI to a client-browsable view of the remote resource, such that
                users may use a web application available at the sender site.
                The URI MUST be absolute, including a hostname. In case the
                underlying resource is a folder, the URI MUST act as a root path,
                such that files located within the folder are made accessible in
                the web app by appending their relative path to the URI.
            targets:
              type: array
              minItems: 1
              description: >
                How the recipient should present the URI to the user.
                This array is REQUIRED and MUST NOT be empty: a webapp
                share without a target is invalid.
                - "blank" signals the recipient to open the URI in a top-level
                browsing context chosen by the receiver, such as a new window or
                tab, or a full page navigation in the current window.
                - "iframe" signals the recipient to embed the URI in an iframe within
                  its own UI, when the Sending Server allows framing by the recipient.
              items:
                type: string
                enum:
                  - blank
                  - iframe
            permissions:
              type: array
              minItems: 1
              description: >
                The permissions granted to the sharee. This array is
                REQUIRED and MUST NOT be empty.
                - `view` allows access to the web app in view-only mode.
                - `read` allows read and download access via the web app.
                - `create` allows creating new resources via the web app.
                - `update` allows updating existing resources via the web app.
                - `delete` allows deleting resources via the web app.
                - `write` allows full editing rights via the web app. It is
                  kept for backwards compatibility and SHALL be interpreted
                  as the union of `create`, `update`, and `delete` in any
                  given permissions set.
                - `share` allows re-share rights on the resource. This only
                  applies to web apps that provide a mechanism for re-sharing.
              items:
                type: string
                enum:
                  - view
                  - read
                  - create
                  - update
                  - delete
                  - write
                  - share
            requirements:
              type: array
              minItems: 1
              # Reject arrays with no must-exchange-token item (OpenAPI 3.0).
              not:
                items:
                  not:
                    enum: [must-exchange-token]
              description: >
                The requirements that the sharee MUST fulfill to access the
                resource. This array is REQUIRED and MUST at least include
                `must-exchange-token`. If multiple protocols are present in
                the share payload, the requirements for the different
                protocols MUST agree.
                - `must-use-mfa` requires the user accessing the resource to be
                  MFA-authenticated. This requirement MAY be used if the
                  recipient provider exposes the `enforce-mfa` capability.
                - `must-exchange-token` requires the recipient to exchange the given
                  `sharedSecret` via a signed HTTPS request to tokenEndPoint at the
                  Sending Server, in order to get a short-lived token to be used
                  for subsequent access [RFC6749].
              items:
                type: string
                enum:
                  - must-use-mfa
                  - must-exchange-token
            sharedSecret:
              type: string
              description: >
                A secret for accessing the remote web app. To give access to the
                remote app, the receiver MUST first exchange this value at the
                Sending Server's `tokenEndPoint` using the Code Flow, then perform
                an HTTP POST request to the given URI with the resulting bearer
                token in a form field named `access_token`, along with another form
                field named `expired_session_redirect_uri` that represents the
                absolute HTTPS URI where the receiving server can restart access
                to the web app when the browser session expires. Web apps that
                do not support session refresh MAY ignore this field.
                The shared secret MUST
                NOT be exposed to the browser and MUST NOT appear in any URI. In a
                multi-protocol share, requirements that affect shared access policy
                MUST agree across the offered protocols.
            appIconHint:
              type: string
              description: >
                An optional string in the form of a media type (MIME type) that
                describes the share as a whole, primarily intended as a way for
                the receiving server to select an appropriate local icon for the
                share. This is display metadata and MUST NOT be interpreted as
                fetchable or executable content. It does not need to appear in any
                of the `apps` media types, but SHOULD describe the primary shared
                resource.
            apps:
              type: array
              minItems: 1
              description: >
                An optional array of the web applications available at the
                Sending Server to access the shared resource, useful in particular
                when the resource is a folder whose files can be opened by different
                web applications. The array MUST NOT contain more than one entry per
                given `name`. The order of the entries MAY express a preference:
                when multiple web applications can handle the same media type, the
                receiver SHOULD consider the first matching entry as the default one.
                All listed web applications are accessed through the same `uri`,
                `sharedSecret`, `targets`, `permissions` and `requirements`.
              items:
                type: object
                required:
                  - name
                  - mediaTypes
                properties:
                  name:
                    type: string
                    description: >
                      A human-friendly name of the web application to be used
                      in user interfaces when referring to this share.
                  mediaTypes:
                    type: array
                    minItems: 1
                    uniqueItems: true
                    description: >
                      The media (MIME) types that this web application can handle.
                      This is a hint for receiver UI and routing decisions, and
                      receivers MAY ignore values they do not understand.
                      Unlike `appIconHint`, this describes formats the web
                      application can open rather than the share-level icon hint.
                    items:
                      type: string
        ssh:
          type: object
          properties:
            accessTypes:
              type: array
              description: >
                The type of access being granted to the remote resource.
                If omitted, it defaults to `['remote']`.
                - `remote` signals the recipient that the resource is available
                  for remote access, e.g. via sshfs.
                - `datatx` signals the recipient to transfer the resource from
                  the given URI via scp. The recipient MAY delegate a third-party
                  service to execute the data transfer on their behalf.
              items:
                type: string
                enum:
                  - remote
                  - datatx
            uri:
              type: string
              description: >
                The full address to be used for ssh or scp access, in the form
                `username@host.fqdn:port/resource/path`, where authentication is
                expected to take place via public/private key.
      additionalProperties:
        type: object
        description: >
          Any optional additional protocols supported for this resource
          MAY be provided here, along with their custom payload. Appropriate
          capabilities SHOULD be advertised in order for a sender to ensure
          the recipient can parse such customized payloads.
    NewShare:
      type: object
      required:
        - shareWith
        - name
        - providerId
        - owner
        - sender
        - shareType
        - resourceType
        - protocol
      allOf:
        - $ref: "#/components/schemas/ShareFields"
      properties:
        encryption:
          type: object
          description: >
            Optional object with encryption information for the share. If omitted,
            it is assumed that the resource is not encrypted, whereas for encrypted
            resources, the key material has to be exchanged out of band, and this
            object MUST be present.
          required:
            - resourceId
            - scheme
          properties:
            resourceId:
              type: string
              description: >
                The unique identifier of the underlying resource. This MUST be the same
                for all shares of the same resource.
            scheme:
              type: string
              description: >
                An identifier of the encryption scheme used to encrypt the resource, as
                defined in the OCM IANA registry for encryption schemes. The value MUST
                be a registered scheme name, such as 'ocm-pgp' or 'ocm-mls'.
          additionalProperties:
            type: object
            description: >
              This object MUST be keyed with the name of the encryption scheme, and its
              value MUST be a JSON object with additional properties specific to that
              scheme. For the 'ocm-pgp' scheme, the object MUST contain a 'fingerprints'
              array of string, with one or more fingerprints of the public keys used to
              encrypt the resource. For the 'ocm-mls' scheme, the object MUST contain
              a 'cipher' string with the identifier of the cipher used to encrypt the
              resource, such as 'AES-256-GCM'.
          example:
            resourceId: 7c084226-d9a1-11e6-bf26-cec0c932ce01
            scheme: ocm-pgp
            ocm-pgp:
              fingerprints:
                - 3F:2A:4B:5C:6D:7E:8F:9A:0B:1C:2D:3E:4F:5A:6B:7C
        protocol:
          type: object
          description: |
            JSON object with specific options for each protocol.
            The supported protocols are:
            - `webdav`, to access the data via WebDAV
            - `webapp`, to access remote web applications
            - `ssh`, to access the data via SFTP/SCP
            Other custom protocols might be added in the future.
          allOf:
            - $ref: "#/components/schemas/ShareProtocolFields"
            - required: [name]
              properties:
                webdav:
                  required: [uri, sharedSecret]
                webapp:
                  required: [uri, sharedSecret, targets, permissions, requirements]
                ssh:
                  required: [uri]
          example:
            singleProtocolLegacy:
              name: webdav
              options:
                sharedSecret: hfiuhworzwnur98d3wjiwhr
                permissions: some permissions scheme
            singleProtocol:
              name: multi
              webdav:
                uri: 7c084226-d9a1-11e6-bf26-cec0c932ce01
                sharedSecret: hfiuhworzwnur98d3wjiwhr
                permissions:
                  - read
                  - write
            multipleProtocols:
              name: multi
              webdav:
                accessTypes: ["remote", "datatx"]
                uri: https://cloud.example.org/remote/dav/ocm/7c084226-d9a1-11e6-bf26-cec0c932ce01
                sharedSecret: hfiuhworzwnur98d3wjiwhr
                permissions:
                  - read
                requirements:
                  - must-use-mfa
                  - must-exchange-token
              webapp:
                uri: https://apps.example.org/hedgedoc/7c084226-d9a1-11e6-bf26-cec0c932ce01
                sharedSecret: hfiuhworzwnur98d3wjiwhr
                targets:
                  - blank
                permissions:
                  - read
                requirements:
                  - must-use-mfa
                  - must-exchange-token
                appIconHint: text/markdown
                apps:
                  - name: HedgeDoc
                    mediaTypes:
                      - text/markdown
                      - text/html
                  - name: Collabora
                    mediaTypes:
                      - application/vnd.oasis.opendocument.text
                      - application/vnd.oasis.opendocument.spreadsheet
              ssh:
                accessTypes: ["datatx"]
                uri: extuser@cloud.example.org:/7c084226-d9a1-11e6-bf26-cec0c932ce01
    NewNotification:
      type: object
      required:
        - notificationType
        - senderDomain
      properties:
        notificationType:
          type: string
          minLength: 1
          description: >
            A non-empty notification type, compared exactly as sent.
            Any value registered in the OCM IANA Registry for notification types
            MAY be used here. Implementers MAY define additional custom types,
            provided that they are registered in the OCM IANA Registry.
        senderDomain:
          allOf:
            - $ref: "#/components/schemas/OCMServerAddress"
          description: >
            OCM Server Address of the sender, used to discover its
            key material and verify the HTTP Message Signature. For
            resource share-state events, it names the provider or recipient server
            according to the event direction; see Share Identity in
            the OCM Internet-Draft.
        resourceType:
          type: string
          minLength: 1
          description: >
            Resource type, according to the OCM IANA Registry for resource types.
            E.g. file, folder, collection, calendar, contact, federation, etc. Implementers
            MAY define additional custom types, provided that they are registered
            in the respective OCM IANA Registry.
        shareType:
          type: string
          minLength: 1
          description: >
            Share type, according to the OCM IANA Registry for share types.
            E.g. user, group, community, etc. Implementers MAY define additional
            custom types, provided that they are registered in the respective
            OCM IANA Registry.
        providerId:
          type: string
          description: >
            Optional unique identifier of the underlying resource. This property
            is now deprecated, in favor of including it in the notification object.
        collectionId:
          type: string
          description: >
            Identifier of the Collection. REQUIRED for REQUEST_SHARE and for a
            SHARE_DECLINED notification declining such a request. These notifications
            MUST set resourceType to collection. REQUEST_SHARE MUST also include shareType.
            A collection-scoped SHARE_DECLINED MUST carry the requested collectionId
            unchanged and the requested recipient in notification.collection.shareWith;
            no providerId is required. It MAY echo the request's shareType.
            It MUST NOT be interpreted as removing or changing any existing Share.
            OCM does not define recipient membership for a Collection.
            SHARE_UNSHARED and SHARE_CHANGE_PERMISSION MUST identify individual Shares
            by providerId and carry their resourceType; collectionId MUST NOT be used
            as their target.
          example: research-data-123
        notification:
          type: object
          description: >
            Optional additional parameters, depending on the notification
            and the resource type or share type in question. For REQUEST_SHARE
            and collection-scoped SHARE_DECLINED, the details are keyed by collection.
          properties:
            message:
              type: string
              description: >
                An optional human-readable message that describes the event.
          additionalProperties:
            type: object
            description: >
              Additional payload objects keyed by resource type or share type.
              Required fields are defined by the notification type.
      allOf:
        - anyOf:
            - required:
                - resourceType
            - required:
                - shareType
        - anyOf:
            - $ref: "#/components/schemas/ShareStateNotification"
            - $ref: "#/components/schemas/CollectionDeclinedNotification"
            - $ref: "#/components/schemas/ReshareRequestNotification"
            - $ref: "#/components/schemas/ShareRequestNotification"
            - $ref: "#/components/schemas/UserRemovedNotification"
            - $ref: "#/components/schemas/GroupRemovedNotification"
            - $ref: "#/components/schemas/ContactRemovedNotification"
            - $ref: "#/components/schemas/FederationMembershipNotification"
            - $ref: "#/components/schemas/NotificationOfOtherType"
    ShareStateNotification:
      type: object
      description: >
        Payload constraints for share lifecycle events; see Share Identity
        in the OCM Internet-Draft.
      required:
        - notificationType
        - resourceType
        - notification
      properties:
        notificationType:
          type: string
          enum:
            - SHARE_ACCEPTED
            - SHARE_DECLINED
            - SHARE_UNSHARED
            - SHARE_CHANGE_PERMISSION
        resourceType:
          not:
            enum:
              - collection
              - federation
        notification:
          type: object
          required:
            - file
          properties:
            file:
              type: object
              required:
                - providerId
              properties:
                providerId:
                  type: string
                  minLength: 1
                  description: >
                    Identifier assigned to this Share by its resource provider.
                permissions:
                  type: array
                  items:
                    $ref: "#/components/schemas/NotificationPermission"
    CollectionDeclinedNotification:
      type: object
      required:
        - notificationType
        - resourceType
        - collectionId
        - notification
      properties:
        notificationType:
          type: string
          enum:
            - SHARE_DECLINED
        resourceType:
          type: string
          enum:
            - collection
        notification:
          type: object
          required:
            - collection
          properties:
            collection:
              type: object
              required:
                - shareWith
              properties:
                shareWith:
                  $ref: "#/components/schemas/OCMAddress"
    ReshareRequestNotification:
      type: object
      required:
        - notificationType
        - resourceType
        - notification
      properties:
        notificationType:
          type: string
          enum:
            - REQUEST_RESHARE
        resourceType:
          not:
            enum:
              - collection
              - federation
        notification:
          type: object
          required:
            - file
          properties:
            file:
              type: object
              required:
                - providerId
                - shareWith
              properties:
                providerId:
                  type: string
                  minLength: 1
                shareWith:
                  $ref: "#/components/schemas/OCMAddress"
                permissions:
                  type: array
                  items:
                    $ref: "#/components/schemas/NotificationPermission"
    ShareRequestNotification:
      type: object
      required:
        - notificationType
        - resourceType
        - collectionId
        - shareType
        - notification
      properties:
        notificationType:
          type: string
          enum:
            - REQUEST_SHARE
        resourceType:
          type: string
          enum:
            - collection
        notification:
          type: object
          required:
            - collection
          properties:
            collection:
              type: object
              required:
                - owner
                - shareWith
                - permissions
              properties:
                owner:
                  $ref: "#/components/schemas/OCMAddress"
                shareWith:
                  $ref: "#/components/schemas/OCMAddress"
                permissions:
                  type: array
                  items:
                    $ref: "#/components/schemas/NotificationPermission"
      not:
        required:
          - collectionSize
    UserRemovedNotification:
      type: object
      required:
        - notificationType
        - shareType
        - notification
      properties:
        notificationType:
          type: string
          enum:
            - USER_REMOVED
        shareType:
          type: string
          enum:
            - user
        notification:
          type: object
          required:
            - user
          properties:
            user:
              type: object
              required:
                - userId
              properties:
                userId:
                  $ref: "#/components/schemas/OCMAddress"
              not:
                required:
                  - targetUserId
      not:
        required:
          - resourceType
    GroupRemovedNotification:
      type: object
      required:
        - notificationType
        - shareType
        - notification
      properties:
        notificationType:
          type: string
          enum:
            - GROUP_REMOVED
        shareType:
          type: string
          enum:
            - group
        notification:
          type: object
          required:
            - group
          properties:
            group:
              type: object
              required:
                - groupId
              properties:
                groupId:
                  type: string
                  minLength: 1
      not:
        required:
          - resourceType
    ContactRemovedNotification:
      type: object
      required:
        - notificationType
        - shareType
        - notification
      properties:
        notificationType:
          type: string
          enum:
            - CONTACT_REMOVED
        shareType:
          type: string
          enum:
            - user
        notification:
          type: object
          required:
            - user
          properties:
            user:
              type: object
              required:
                - userId
                - targetUserId
              properties:
                userId:
                  description: >
                    OCM Address of the actor. Its OCM Server Address equals
                    senderDomain.
                  allOf:
                    - $ref: "#/components/schemas/OCMAddress"
                targetUserId:
                  description: >
                    OCM Address of the removed contact at the receiving server.
                  allOf:
                    - $ref: "#/components/schemas/OCMAddress"
      not:
        required:
          - resourceType
    FederationMembershipNotification:
      type: object
      required: [notificationType, resourceType, notification]
      not:
        required: [shareType]
      properties:
        notificationType:
          type: string
          enum: [OCM_SERVER_ADDED, OCM_SERVER_REMOVED]
        resourceType:
          type: string
          enum: [federation]
        notification:
          type: object
          required: [federation]
          properties:
            federation:
              type: object
              required: [federationId, url]
              properties:
                federationId:
                  type: string
                  description: Matches federation.federationId in the sender's directory.
                name:
                  type: string
                url:
                  type: string
                  format: uri
                  description: >
                    The recipient's server URL for OCM_SERVER_ADDED, or the
                    sender's server URL for OCM_SERVER_REMOVED, as defined in
                    Federation Membership of the OCM Internet-Draft.
                mlsGroupId:
                  type: string
    NotificationOfOtherType:
      type: object
      description: >
        Other notification types satisfy the common envelope. Built-in types
        cannot use this branch to bypass payload validation.
      properties:
        notificationType:
          type: string
          not:
            enum:
              - SHARE_ACCEPTED
              - SHARE_DECLINED
              - SHARE_UNSHARED
              - SHARE_CHANGE_PERMISSION
              - REQUEST_RESHARE
              - REQUEST_SHARE
              - USER_REMOVED
              - CONTACT_REMOVED
              - GROUP_REMOVED
              - OCM_SERVER_ADDED
              - OCM_SERVER_REMOVED
    NotificationPermission:
      type: string
      description: A permission value of the webdav or webapp protocol.
      enum:
        - read
        - create
        - update
        - delete
        - write
        - share
        - view
    OCMServerAddress:
      type: string
      minLength: 1
      description: >
        The host and optional port of an OCM Server, as defined in Terms
        of the OCM Internet-Draft. No identifier, scheme, path, query or
        fragment. Compare the complete value after lowercasing, preserving
        explicit ports and all other spelling.
      example: cloud.example.org:8443
    OCMAddress:
      type: string
      minLength: 1
      description: >
        An OCM Address as defined in Terms of the OCM Internet-Draft:
        a non-empty opaque identifier followed by "@" and an OCM Server
        Address. Split at the last "@"; compare identifiers byte for byte.
      example: alice@cloud.example.org:8443
    AcceptedInvite:
      type: object
      required:
        - recipientProvider
        - token
        - userID
        - email
        - name
      properties:
        recipientProvider:
          allOf:
            - $ref: "#/components/schemas/OCMServerAddress"
          description: OCM Server Address of the Invite Receiver.
          example: receiver.org
        token:
          type: string
          description: Token received in the invite
          example: xyz
        userID:
          type: string
          description: Unique ID to identify the Invite Receiver at their OCM Server.
          example: 51dc30ddc473d43a6011e9ebba6ca770
        email:
          type: string
          description: Email address of the Invite Receiver.
          example: richard@gmail.com
        name:
          type: string
          description: Name of the Invite Receiver.
          example: Richard Feynman
    AcceptedInviteResponse:
      type: object
      required:
        - userID
        - email
        - name
      properties:
        userID:
          type: string
          description: Unique ID to identify the Invite Sender at their OCM Server.
          example: 9302
        email:
          type: string
          description: Email ID of the Invite Sender.
          example: john@sender.org
        name:
          type: string
          description: Name of the Invite Sender.
          example: John Doe
    TokenRequest:
      type: object
      required:
        - grant_type
        - client_id
        - code
      properties:
        client_id:
          allOf:
            - $ref: "#/components/schemas/OCMServerAddress"
          description: OCM Server Address of the Receiving Server.
          example: receiver.org
        code:
          type: string
          description: Secret received in the Share Creation Notification
          example: xyz
        grant_type:
          type: string
          description: Must be set to 'authorization_code'
          enum: ["authorization_code"]
          example: authorization_code
        redirect_uri:
          type: string
          description: >
            Optional parameter that MUST be ignored by the server.
          example: https://receiver.org/ocm/callback
    TokenResponse:
      type: object
      required:
        - access_token
        - token_type
      properties:
        access_token:
          type: string
          description: The bearer token to be used to access the protocol-specific API(s)
          example: asdfgh
        token_type:
          type: string
          description: Must be set to 'Bearer'
          enum:
            - Bearer
          example: Bearer
        expires_in:
          type: integer
          description: Number of seconds before this access_token will need to be refreshed.
          example: 300
