name: Prepare I-Ds for Datatracker

on:
  workflow_dispatch:
    inputs:
      bump_OCM:
        description: 'Bump version for main OCM I-D'
        required: true
        type: boolean
        default: false
      bump_OCM-IP:
        description: 'Bump version for OCM-IP I-D'
        required: true
        type: boolean
        default: false
      bump_OCM-MLS:
        description: 'Bump version for OCM-MLS I-D'
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install kramdown-rfc
        run: gem install --no-document kramdown-rfc

      - name: Bump I-D version for the selected Drafts
        env:
          # Passes checkbox states safely to the shell as a JSON object
          ALL_INPUTS: ${{ toJson(inputs) }}
        run: |
          for doc in OCM OCM-IP OCM-MLS; do
            is_enabled=$(echo "$ALL_INPUTS" | jq -r ".\"bump_${doc}\"")
            if [ "$is_enabled" = "true" ]; then
              echo "Bumping version in ${doc} I-D"
              perl -pe 's/(docname: draft.*-)(\d+)/$1 . sprintf("%02d", $2 + 1)/ge' -i IETF-${doc}.md || exit -1
            fi
          done

      - name: Convert Markdown to XML and save output
        id: convert
        run: |
          for doc in IETF-*.md; do
            kramdown-rfc ${doc} > ${doc/md/xml} 2>> /tmp/result || true
          done
          cat /tmp/result
          echo "result<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/result >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: rfc-md
          path: IETF-*.md

      - uses: actions/upload-artifact@v4
        with:
          name: rfc-xml
          path: IETF-*.xml

      # Create a PR to the repo with the results
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: rfc/gen-${{ github.sha }}
          base: develop
          add-paths: |
            IETF-*.md
            IETF-*.xml
          commit-message: 'CI: regenerate IETF XML files for Datatracker'
          signoff: true
          title: 'Regenerate IETF XML files'
          body: |
            This autogenerated PR bumps the IETF version of the I-Ds that were selected, and prepares the xml files for submission to the [IETF Datatracker](https://datatracker.ietf.org/submit).

            The conversion produced the output below:
            ```
            ${{ steps.convert.outputs.result }}
            ```
          reviewers: |
            glpatcern
            MahdiBaghbani
            mickenordin
